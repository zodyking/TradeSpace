# Dockploy / Dokploy — required overlay (set COMPOSE_FILE in project env).
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dockploy.yml
#
# Set QD_PUBLIC_HOST to your domain (sslip.io = HTTP only, HTTPS off in UI).
# Set FRONTEND_URL in backend_api_python/.env to http://${QD_PUBLIC_HOST}

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    ports: !reset []
    networks:
      - quantdinger-network
      - dokploy-network

  frontend:
    ports: !reset []
    expose:
      - "80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
    networks:
      - quantdinger-network
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-dokploy-network}
      - traefik.http.routers.qd-web.rule=Host(`${QD_PUBLIC_HOST:?set QD_PUBLIC_HOST to your domain}`)
      - traefik.http.routers.qd-web.entrypoints=web
      - traefik.http.routers.qd-web.service=qd-web
      - traefik.http.services.qd-web.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
