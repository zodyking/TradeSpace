# Dockploy / Dokploy: do not publish DB/Redis/API on the host (fixes :5432 / :6379 conflicts).
# Project env: COMPOSE_FILE=docker-compose.yml:docker-compose.dockploy.yml
# Domain: service frontend, container port 80

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    ports: !reset []
    networks:
      - quantdinger-network
      - dokploy-network

  frontend:
    ports: !reset []
    expose:
      - "80"
    networks:
      - quantdinger-network
      - dokploy-network

networks:
  dokploy-network:
    external: true
