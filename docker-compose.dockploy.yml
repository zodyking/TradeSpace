# =============================================================================
# QuantDinger — Dokploy ONLY (do not merge with docker-compose.yml)
# =============================================================================
# Dokploy UI:
#   Compose file: docker-compose.dockploy.yml
#   Environment:  DELETE variable COMPOSE_FILE if present
#   Domains:       REMOVE all domains here (routing is in labels below)
# Open: http://qauntview-quantview-lwersl-74dba7-155-138-143-191.sslip.io
# =============================================================================

services:
  postgres:
    image: ${IMAGE_PREFIX:-}postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantdinger}
      POSTGRES_USER: ${POSTGRES_USER:-quantdinger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantdinger123}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-150}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantdinger} -d ${POSTGRES_DB:-quantdinger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${IMAGE_PREFIX:-}redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_api_python
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        BUILD_REGION: ${BUILD_REGION:-global}
    image: ${BACKEND_IMAGE:-ghcr.io/brokermr810/quantdinger-backend}:${BACKEND_TAG:-${IMAGE_TAG:-latest}}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend.env.dockploy
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ./backend.env.dockploy:/app/.env
    environment:
      - PYTHON_API_HOST=0.0.0.0
      - PYTHON_API_PORT=5000
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quantdinger}:${POSTGRES_PASSWORD:-quantdinger123}@postgres:5432/${POSTGRES_DB:-quantdinger}
      - DB_TYPE=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_ENABLED=true
      - FRONTEND_URL=http://qauntview-quantview-lwersl-74dba7-155-138-143-191.sslip.io
      - ALLOW_LOCAL_DESKTOP_BROKERS=false
      - ADMIN_USER=quantdinger
      - ADMIN_PASSWORD=123456
      - SYNC_ADMIN_PASSWORD_ON_START=true
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/brokermr810/quantdinger-frontend}:${FRONTEND_TAG:-${IMAGE_TAG:-latest}}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.qd-web.rule=Host(`qauntview-quantview-lwersl-74dba7-155-138-143-191.sslip.io`)
      - traefik.http.routers.qd-web.entrypoints=web
      - traefik.http.routers.qd-web.service=qd-web
      - traefik.http.services.qd-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  backend_logs:
  backend_data:

networks:
  dokploy-network:
    external: true
