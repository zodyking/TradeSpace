# Dockploy / Dokploy overlay — no host ports on DB/Redis/API (avoids 5432/6379/5000 conflicts).
#
# Set in Dockploy project env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dockploy.yml
#
# Domain UI: service frontend, container port 80, HTTPS off for *.sslip.io

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    ports: !reset []
    networks:
      - quantdinger-network
      - dokploy-network

  frontend:
    ports: !reset []
    expose:
      - "80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
    networks:
      - quantdinger-network
      - dokploy-network

networks:
  dokploy-network:
    external: true
